<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">워크스페이스의 공유 항목과 패키지 경계</title>
  <desc id="desc">하나의 워크스페이스 안에서 domain과 cli 패키지가 Cargo.lock과 target 디렉터리와 카고 명령을 공유하지만 각자 Cargo.toml과 크레이트 경계를 유지하고 cli가 domain을 사용하려면 경로 의존성을 명시해야 하는 관계</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="workspace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18242d"/>
      <stop offset="1" stop-color="#111a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="dependencyArrow" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#f4c95d"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .heading { fill: #f4f7fa; font-size: 29px; font-weight: 820; }
      .label { fill: #edf3f7; font-size: 25px; font-weight: 760; }
      .small { fill: #aebdca; font-size: 20px; font-weight: 550; }
      .code { fill: #eef3f7; font-family: "SFMono-Regular", Consolas, monospace; font-size: 21px; }
      .shared { fill: none; stroke: #8fa3b8; stroke-width: 3; stroke-dasharray: 9 8; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <text x="800" y="66" fill="#f4f7fa" font-size="36" font-weight="850" text-anchor="middle">워크스페이스는 함께 관리하되 경계를 합치지 않습니다</text>

  <rect x="55" y="105" width="1490" height="720" rx="30" fill="url(#workspace)" stroke="#f1b85b" stroke-width="4" filter="url(#shadow)"/>
  <rect x="90" y="130" width="300" height="60" rx="16" fill="#362b1f" stroke="#f1b85b" stroke-width="2"/>
  <text x="240" y="169" fill="#ffd27a" font-size="26" font-weight="800" text-anchor="middle">카고 워크스페이스</text>

  <text x="800" y="225" class="heading" text-anchor="middle">함께 사용하는 항목</text>

  <rect x="225" y="255" width="310" height="90" rx="20" fill="#17383a" stroke="#55d6c2" stroke-width="3"/>
  <text x="380" y="310" class="code" text-anchor="middle">Cargo.lock</text>

  <rect x="645" y="255" width="310" height="90" rx="20" fill="#17383a" stroke="#55d6c2" stroke-width="3"/>
  <text x="800" y="310" class="code" text-anchor="middle">target/</text>

  <rect x="1065" y="255" width="310" height="90" rx="20" fill="#17383a" stroke="#55d6c2" stroke-width="3"/>
  <text x="1220" y="295" class="code" text-anchor="middle">cargo test</text>
  <text x="1220" y="325" class="small" text-anchor="middle">여러 패키지에 함께 실행</text>

  <path class="shared" d="M 380 345 L 380 405 M 800 345 L 800 405 M 1220 345 L 1220 405 M 380 405 L 1220 405"/>
  <path class="shared" d="M 540 405 L 540 465 M 1060 405 L 1060 465"/>

  <rect x="150" y="455" width="560" height="285" rx="26" fill="#10272a" stroke="#55d6c2" stroke-width="4"/>
  <text x="430" y="510" class="heading" text-anchor="middle">domain 패키지</text>
  <text x="430" y="545" class="code" text-anchor="middle">domain/Cargo.toml</text>
  <rect x="220" y="585" width="420" height="100" rx="20" fill="#17383a" stroke="#3a9f94" stroke-width="3"/>
  <text x="430" y="625" class="label" text-anchor="middle">라이브러리 크레이트</text>
  <text x="430" y="660" class="small" text-anchor="middle">업무 규칙과 공개 API</text>

  <rect x="890" y="455" width="560" height="285" rx="26" fill="#241f31" stroke="#b49cff" stroke-width="4"/>
  <text x="1170" y="510" class="heading" text-anchor="middle">cli 패키지</text>
  <text x="1170" y="545" class="code" text-anchor="middle">cli/Cargo.toml</text>
  <rect x="960" y="585" width="420" height="100" rx="20" fill="#332b48" stroke="#7965b6" stroke-width="3"/>
  <text x="1170" y="625" class="label" text-anchor="middle">실행 파일 크레이트</text>
  <text x="1170" y="660" class="small" text-anchor="middle">명령줄 입력과 출력</text>

  <text x="800" y="690" fill="#f4c95d" font-size="19" font-weight="750" text-anchor="middle">cli가 domain을 사용</text>
  <path d="M 890 715 L 710 715" fill="none" stroke="#f4c95d" stroke-width="5" marker-end="url(#dependencyArrow)"/>
  <rect x="560" y="752" width="480" height="58" rx="18" fill="#342f1d" stroke="#f4c95d" stroke-width="2"/>
  <text x="800" y="789" class="code" text-anchor="middle">domain = { path = "../domain" }</text>

  <text x="800" y="870" fill="#9fb0bf" font-size="22" font-weight="650" text-anchor="middle">같은 워크스페이스에 있어도 패키지 사이의 의존성은 Cargo.toml에 직접 선언합니다</text>
</svg>
