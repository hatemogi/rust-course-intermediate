<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">모듈 트리와 소스 파일의 대응 관계</title>
  <desc id="desc">왼쪽의 논리적인 모듈 트리에서 lib 아래에 parser와 report가 있고 report 아래에 text가 있으며, 오른쪽의 lib.rs, parser.rs, report.rs, report/text.rs 파일과 각각 연결되는 관계</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18242d"/>
      <stop offset="1" stop-color="#111a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#8fa3b8"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .heading { fill: #f4f7fa; font-size: 30px; font-weight: 800; }
      .label { fill: #edf3f7; font-size: 25px; font-weight: 750; }
      .small { fill: #aebdca; font-size: 20px; font-weight: 550; }
      .code { fill: #dce7ef; font-family: "SFMono-Regular", Consolas, monospace; font-size: 22px; }
      .tree { fill: none; stroke: #64788c; stroke-width: 4; }
      .map { fill: none; stroke: #8fa3b8; stroke-width: 3; stroke-dasharray: 10 9; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <text x="800" y="66" fill="#f4f7fa" font-size="36" font-weight="850" text-anchor="middle">모듈 트리와 파일 트리는 서로 다른 구조입니다</text>

  <rect x="55" y="105" width="650" height="695" rx="28" fill="url(#panel)" stroke="#55d6c2" stroke-width="4" filter="url(#shadow)"/>
  <rect x="895" y="105" width="650" height="695" rx="28" fill="url(#panel)" stroke="#b49cff" stroke-width="4" filter="url(#shadow)"/>

  <text x="380" y="158" class="heading" text-anchor="middle">논리 구조: 모듈 트리</text>
  <text x="1220" y="158" class="heading" text-anchor="middle">저장 구조: 소스 파일</text>

  <path class="tree" d="M 165 278 L 165 650 M 165 410 L 225 410 M 165 535 L 225 535 M 285 575 L 285 670 M 285 650 L 345 650"/>

  <rect x="105" y="205" width="445" height="82" rx="18" fill="#17383a" stroke="#55d6c2" stroke-width="3"/>
  <text x="132" y="240" class="label">크레이트 루트</text>
  <text x="132" y="270" class="code">lib</text>

  <rect x="225" y="366" width="365" height="84" rx="18" fill="#152932" stroke="#55d6c2" stroke-width="3"/>
  <text x="255" y="401" class="label">parser 모듈</text>
  <text x="255" y="432" class="small">파싱 책임</text>

  <rect x="225" y="491" width="365" height="84" rx="18" fill="#152932" stroke="#55d6c2" stroke-width="3"/>
  <text x="255" y="526" class="label">report 모듈</text>
  <text x="255" y="557" class="small">보고서 책임</text>

  <rect x="345" y="608" width="290" height="84" rx="18" fill="#152932" stroke="#f4c95d" stroke-width="3"/>
  <text x="375" y="643" class="label">text 모듈</text>
  <text x="375" y="674" class="small">report의 자식</text>

  <rect x="1005" y="205" width="425" height="82" rx="18" fill="#332b48" stroke="#b49cff" stroke-width="3"/>
  <text x="1035" y="238" class="code">src/lib.rs</text>
  <text x="1035" y="268" class="small">mod parser; mod report;</text>

  <rect x="1005" y="366" width="425" height="84" rx="18" fill="#29233a" stroke="#b49cff" stroke-width="3"/>
  <text x="1035" y="418" class="code">src/parser.rs</text>

  <rect x="1005" y="491" width="425" height="84" rx="18" fill="#29233a" stroke="#b49cff" stroke-width="3"/>
  <text x="1035" y="524" class="code">src/report.rs</text>
  <text x="1035" y="555" class="small">mod text;</text>

  <rect x="1005" y="608" width="425" height="84" rx="18" fill="#29233a" stroke="#f4c95d" stroke-width="3"/>
  <text x="1035" y="660" class="code">src/report/text.rs</text>

  <path class="map" d="M 550 246 L 985 246"/>
  <path class="map" d="M 590 408 L 985 408"/>
  <path class="map" d="M 590 533 L 985 533"/>
  <path class="map" d="M 635 650 L 985 650"/>

  <rect x="650" y="326" width="300" height="58" rx="29" fill="#1e2933" stroke="#64788c" stroke-width="2"/>
  <text x="800" y="363" class="small" text-anchor="middle">파일은 모듈 코드를 저장</text>

  <text x="800" y="850" fill="#9fb0bf" font-size="22" font-weight="650" text-anchor="middle">이름과 부모·자식 관계는 mod 선언이 만든 모듈 트리가 결정합니다</text>
</svg>
