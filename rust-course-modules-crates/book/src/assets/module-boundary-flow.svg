<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">모듈 경계를 결정하는 순서도</title>
  <desc id="desc">나눌 코드 후보에서 시작해 역할이 다른지, 함께 바뀌는지, 외부 사용자가 직접 써야 하는지를 차례로 판단하고 같은 모듈 유지, 별도 모듈 분리, 공개 API 구성, 비공개 구현 유지로 이어진 뒤 의존 방향을 점검하는 순서도</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 16 16" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 z" fill="#8fa3b8"/>
    </marker>
    <marker id="cyanArrow" viewBox="0 0 16 16" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 z" fill="#55d6c2"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .label { fill: #eef3f7; font-size: 25px; font-weight: 780; }
      .small { fill: #aebdca; font-size: 19px; font-weight: 560; }
      .code { fill: #eef3f7; font-family: "SFMono-Regular", Consolas, monospace; font-size: 20px; }
      .flow { fill: none; stroke: #8fa3b8; stroke-width: 4; marker-end: url(#arrow); }
      .flow-cyan { fill: none; stroke: #55d6c2; stroke-width: 4; marker-end: url(#cyanArrow); }
      .branch { fill: #f4c95d; font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <text x="800" y="62" fill="#f4f7fa" font-size="36" font-weight="850" text-anchor="middle">모듈 경계는 역할과 변경 이유부터 확인합니다</text>

  <rect x="610" y="90" width="380" height="68" rx="34" fill="#17383a" stroke="#55d6c2" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="132" class="label" text-anchor="middle">나눌 코드 후보를 고른다</text>

  <path class="flow-cyan" d="M 800 158 L 800 185"/>

  <path d="M 800 180 L 1080 265 L 800 350 L 520 265 Z" fill="#18242d" stroke="#f4c95d" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="252" class="label" text-anchor="middle">역할이 다른가?</text>
  <text x="800" y="285" class="small" text-anchor="middle">파싱 · 업무 규칙 · 출력</text>

  <path class="flow" d="M 800 350 L 800 382"/>
  <text x="820" y="373" class="branch">아니요</text>

  <path d="M 800 380 L 1050 460 L 800 540 L 550 460 Z" fill="#18242d" stroke="#b49cff" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="447" class="label" text-anchor="middle">함께 바뀌는가?</text>
  <text x="800" y="480" class="small" text-anchor="middle">같은 이유로 함께 수정되는가?</text>

  <path class="flow-cyan" d="M 550 460 L 455 460"/>
  <text x="500" y="440" class="branch">예</text>
  <rect x="90" y="410" width="345" height="100" rx="22" fill="#10272a" stroke="#55d6c2" stroke-width="4" filter="url(#shadow)"/>
  <text x="262" y="451" class="label" text-anchor="middle">같은 모듈에 둔다</text>
  <text x="262" y="483" class="small" text-anchor="middle">서로 가까이 배치</text>

  <path class="flow" d="M 1080 265 L 1350 265 L 1350 390"/>
  <text x="1110" y="245" class="branch">예</text>
  <path class="flow" d="M 1050 460 L 1160 460"/>
  <text x="1082" y="440" class="branch">아니요</text>
  <rect x="1180" y="405" width="340" height="110" rx="22" fill="#241f31" stroke="#b49cff" stroke-width="4" filter="url(#shadow)"/>
  <text x="1350" y="449" class="label" text-anchor="middle">별도 모듈로 나눈다</text>
  <text x="1350" y="482" class="small" text-anchor="middle">역할이 드러나는 이름 사용</text>

  <path class="flow" d="M 1350 515 L 1350 540 L 1050 540"/>
  <path d="M 1050 525 L 1290 610 L 1050 695 L 810 610 Z" fill="#18242d" stroke="#ff9868" stroke-width="4" filter="url(#shadow)"/>
  <text x="1050" y="597" class="label" text-anchor="middle">외부 사용자가 직접 써야 하는가?</text>
  <text x="1050" y="630" class="small" text-anchor="middle">공개 경로에 필요한 이름인가?</text>

  <path class="flow" d="M 810 610 L 700 610 L 700 695"/>
  <text x="755" y="590" class="branch">예</text>
  <rect x="500" y="705" width="400" height="82" rx="20" fill="#30231d" stroke="#ff9868" stroke-width="4"/>
  <text x="700" y="738" class="label" text-anchor="middle">필요한 API만 공개</text>
  <text x="700" y="767" class="code" text-anchor="middle">pub · pub use</text>

  <path class="flow" d="M 1290 610 L 1340 610 L 1340 695"/>
  <text x="1315" y="590" class="branch">아니요</text>
  <rect x="1120" y="705" width="400" height="82" rx="20" fill="#152932" stroke="#55d6c2" stroke-width="4"/>
  <text x="1320" y="738" class="label" text-anchor="middle">구현 모듈은 비공개</text>
  <text x="1320" y="767" class="code" text-anchor="middle">mod implementation;</text>

  <path d="M 700 787 L 700 815" fill="none" stroke="#8fa3b8" stroke-width="3"/>
  <path d="M 1320 787 L 1320 815" fill="none" stroke="#8fa3b8" stroke-width="3"/>
  <rect x="300" y="815" width="1100" height="62" rx="20" fill="#1a2530" stroke="#f4c95d" stroke-width="3"/>
  <text x="850" y="842" fill="#f4c95d" font-size="21" font-weight="780" text-anchor="middle">마지막 점검: 의존 방향이 한쪽인가?</text>
  <text x="850" y="868" class="small" text-anchor="middle">상위 모듈이 하위 구현을 조합하지 못하고 서로 참조한다면 경계를 다시 조정합니다</text>
</svg>
