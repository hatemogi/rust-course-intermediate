<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">crate, self, super 경로의 시작점</title>
  <desc id="desc">현재 위치가 catalog 모듈일 때 crate 경로는 크레이트 루트, super 경로는 부모 shop 모듈, self 경로는 현재 catalog 모듈에서 시작하는 관계와 use로 긴 경로를 짧게 가져오는 과정</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="cyanArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#55d6c2"/>
    </marker>
    <marker id="yellowArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f4c95d"/>
    </marker>
    <marker id="purpleArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#b49cff"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .label { fill: #edf3f7; font-size: 26px; font-weight: 760; }
      .small { fill: #aebdca; font-size: 20px; font-weight: 550; }
      .code { fill: #eef3f7; font-family: "SFMono-Regular", Consolas, monospace; font-size: 23px; }
      .tree { fill: none; stroke: #64788c; stroke-width: 5; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <text x="800" y="66" fill="#f4f7fa" font-size="36" font-weight="850" text-anchor="middle">경로 접두사는 탐색을 시작할 모듈을 정합니다</text>

  <rect x="70" y="112" width="780" height="620" rx="28" fill="#121d26" stroke="#344556" stroke-width="3" filter="url(#shadow)"/>
  <text x="110" y="162" fill="#aebdca" font-size="22" font-weight="650">현재 위치: catalog 모듈</text>

  <rect x="110" y="205" width="650" height="105" rx="20" fill="#17383a" stroke="#55d6c2" stroke-width="3"/>
  <text x="145" y="248" class="code">crate::shop::catalog::item_count</text>
  <text x="145" y="282" class="small">현재 크레이트의 루트에서 시작</text>

  <rect x="110" y="350" width="650" height="105" rx="20" fill="#342f1d" stroke="#f4c95d" stroke-width="3"/>
  <text x="145" y="393" class="code">super::has_items</text>
  <text x="145" y="427" class="small">부모인 shop 모듈에서 시작</text>

  <rect x="110" y="495" width="650" height="105" rx="20" fill="#332b48" stroke="#b49cff" stroke-width="3"/>
  <text x="145" y="538" class="code">self::item_count</text>
  <text x="145" y="572" class="small">현재 catalog 모듈에서 시작</text>

  <rect x="925" y="112" width="605" height="620" rx="28" fill="#121d26" stroke="#344556" stroke-width="3" filter="url(#shadow)"/>
  <text x="1225" y="162" fill="#edf3f7" font-size="28" font-weight="800" text-anchor="middle">모듈 트리</text>

  <path class="tree" d="M 1225 257 L 1225 355 M 1225 455 L 1225 535 M 1225 635 L 1225 688 M 1225 688 L 1395 688"/>

  <rect x="1020" y="195" width="410" height="86" rx="19" fill="#17383a" stroke="#55d6c2" stroke-width="4"/>
  <text x="1225" y="232" class="label" text-anchor="middle">크레이트 루트</text>
  <text x="1225" y="261" class="small" text-anchor="middle">crate:: 시작점</text>

  <rect x="1020" y="355" width="410" height="100" rx="19" fill="#342f1d" stroke="#f4c95d" stroke-width="4"/>
  <text x="1225" y="397" class="label" text-anchor="middle">shop 모듈</text>
  <text x="1225" y="430" class="small" text-anchor="middle">super:: 시작점</text>

  <rect x="1020" y="535" width="410" height="100" rx="19" fill="#332b48" stroke="#b49cff" stroke-width="5"/>
  <text x="1225" y="577" class="label" text-anchor="middle">catalog 모듈</text>
  <text x="1225" y="610" fill="#d9ceff" font-size="21" font-weight="700" text-anchor="middle">현재 위치 · self:: 시작점</text>

  <rect x="1325" y="654" width="170" height="68" rx="17" fill="#1b2730" stroke="#64788c" stroke-width="3"/>
  <text x="1410" y="696" class="small" text-anchor="middle">item_count</text>

  <path d="M 760 257 C 855 257 880 238 1000 238" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#cyanArrow)"/>
  <path d="M 760 402 C 855 402 880 405 1000 405" fill="none" stroke="#f4c95d" stroke-width="4" marker-end="url(#yellowArrow)"/>
  <path d="M 760 547 C 855 547 880 585 1000 585" fill="none" stroke="#b49cff" stroke-width="4" marker-end="url(#purpleArrow)"/>

  <rect x="180" y="770" width="1240" height="78" rx="22" fill="#1a2530" stroke="#55d6c2" stroke-width="2"/>
  <text x="220" y="818" class="code">use crate::shop::catalog;</text>
  <text x="650" y="818" fill="#8fa3b8" font-size="30" font-weight="800">→</text>
  <text x="725" y="818" class="code">catalog::item_count()</text>
  <text x="1370" y="818" class="small" text-anchor="end">현재 범위에서 짧은 이름 사용</text>
</svg>
