[book]
title = "우아한 Rust 중급: 패키지·크레이트·모듈"
authors = ["rust-course-intermediate"]
description = "Rust 프로젝트 구조와 공개 API 경계를 배우는 강의 교재"
language = "ko"
src = "src"

[build]
build-dir = "html"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/rust-course-intermediate/modules-crates/"
git-repository-url = "https://github.com/hatemogi/rust-course-intermediate"
edit-url-template = "https://github.com/hatemogi/rust-course-intermediate/edit/main/rust-course-modules-crates/book/{path}"
additional-css = ["theme/tooling.css"]
additional-js = ["theme/recording.js"]

[output.html.playground]
editable = false
runnable = false
copyable = true
line-numbers = true
