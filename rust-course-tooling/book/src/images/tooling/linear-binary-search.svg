<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">선형 검색과 이진 검색 과정 비교</title>
  <desc id="desc">정렬되지 않은 배열에서 선형 검색은 앞에서부터 여섯 칸을 보고, 정렬된 배열에서 이진 검색은 범위를 줄이며 세 칸을 보는 예</desc>
  <style>
    .sans { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .mono { font-family: "SFMono-Regular", "Cascadia Code", Menlo, monospace; }
    .heading { fill: #55d6c2; font-size: 25px; font-weight: 750; }
    .muted { fill: #aebbc7; font-size: 17px; }
    .value { fill: #eef3f7; font-size: 20px; text-anchor: middle; dominant-baseline: middle; }
    .summary { fill: #eef3f7; font-size: 20px; }
  </style>
  <rect width="960" height="500" rx="22" fill="#10151c"/>

  <rect x="34" y="35" width="892" height="160" rx="18" fill="#090d12" fill-opacity=".72" stroke="#344556"/>
  <text x="62" y="78" class="sans heading">선형 검색</text>
  <text x="62" y="109" class="sans muted">정렬되지 않아도 됩니다.</text>
  <g transform="translate(260 67)">
    <g fill="#19222d" stroke="#f47b32" stroke-opacity=".55">
      <rect x="0" y="0" width="66" height="62" rx="10"/><rect x="73" y="0" width="66" height="62" rx="10"/>
      <rect x="146" y="0" width="66" height="62" rx="10"/><rect x="219" y="0" width="66" height="62" rx="10"/>
      <rect x="292" y="0" width="66" height="62" rx="10"/><rect x="365" y="0" width="66" height="62" rx="10" fill="#f47b32" fill-opacity=".18"/>
      <rect x="438" y="0" width="66" height="62" rx="10" stroke="#344556"/>
    </g>
    <g class="mono value">
      <text x="33" y="31">34</text><text x="106" y="31">5</text><text x="179" y="31">21</text>
      <text x="252" y="31">2</text><text x="325" y="31">13</text><text x="398" y="31" fill="#ffd4bb" font-weight="800">55</text><text x="471" y="31">8</text>
    </g>
  </g>
  <text x="792" y="159" class="sans summary" text-anchor="middle">앞에서부터 <tspan fill="#f4c95d" font-weight="750">6칸</tspan> 확인</text>

  <rect x="34" y="215" width="892" height="160" rx="18" fill="#090d12" fill-opacity=".72" stroke="#344556"/>
  <text x="62" y="258" class="sans heading">이진 검색</text>
  <text x="62" y="289" class="sans muted">정렬된 입력이 필요합니다.</text>
  <g transform="translate(260 247)">
    <g fill="#19222d" stroke="#344556">
      <rect x="0" y="0" width="66" height="62" rx="10"/><rect x="73" y="0" width="66" height="62" rx="10"/>
      <rect x="146" y="0" width="66" height="62" rx="10"/><rect x="219" y="0" width="66" height="62" rx="10" stroke="#55d6c2"/>
      <rect x="292" y="0" width="66" height="62" rx="10"/><rect x="365" y="0" width="66" height="62" rx="10" stroke="#55d6c2"/>
      <rect x="438" y="0" width="66" height="62" rx="10" fill="#f47b32" fill-opacity=".18" stroke="#55d6c2"/>
    </g>
    <g class="mono value">
      <text x="33" y="31">2</text><text x="106" y="31">5</text><text x="179" y="31">8</text>
      <text x="252" y="31">13</text><text x="325" y="31">21</text><text x="398" y="31">34</text><text x="471" y="31" fill="#ffd4bb" font-weight="800">55</text>
    </g>
    <g class="sans" font-size="12" font-weight="800" text-anchor="middle" dominant-baseline="middle">
      <circle cx="278" cy="-4" r="12" fill="#55d6c2"/><text x="278" y="-4" fill="#07110f">1</text>
      <circle cx="424" cy="-4" r="12" fill="#55d6c2"/><text x="424" y="-4" fill="#07110f">2</text>
      <circle cx="497" cy="-4" r="12" fill="#55d6c2"/><text x="497" y="-4" fill="#07110f">3</text>
    </g>
  </g>
  <text x="792" y="339" class="sans summary" text-anchor="middle">범위를 줄여 <tspan fill="#f4c95d" font-weight="750">3칸</tspan> 확인</text>

  <g class="sans" font-size="19" text-anchor="middle">
    <rect x="230" y="409" width="200" height="54" rx="11" fill="#19222d" stroke="#344556"/>
    <text x="330" y="442" fill="#eef3f7">정렬되지 않은 입력</text>
    <text x="459" y="442" fill="#f47b32">→</text>
    <rect x="487" y="409" width="132" height="54" rx="11" fill="#19222d" stroke="#344556"/>
    <text x="553" y="442" fill="#eef3f7">정렬 비용</text>
    <text x="647" y="442" fill="#f47b32">+</text>
    <rect x="674" y="409" width="132" height="54" rx="11" fill="#19222d" stroke="#344556"/>
    <text x="740" y="442" fill="#eef3f7">이진 검색</text>
  </g>
</svg>
