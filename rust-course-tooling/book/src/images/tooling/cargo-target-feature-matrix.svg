<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">카고 타깃과 피처의 두 축</title>
  <desc id="desc">가로축에는 라이브러리, 실행 파일, 예제와 테스트 타깃이 있고 세로축에는 기본 구성과 binary-search 피처 구성이 있는 격자</desc>
  <style>
    .sans { font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .mono { font-family: "SFMono-Regular", "Cascadia Code", Menlo, monospace; }
    .axis { fill: #55d6c2; font-size: 21px; font-weight: 750; }
    .head { fill: #aebbc7; font-size: 18px; text-anchor: middle; dominant-baseline: middle; }
    .row { fill: #eef3f7; font-size: 18px; dominant-baseline: middle; }
    .legend { fill: #eef3f7; font-size: 20px; }
  </style>
  <rect width="960" height="450" rx="22" fill="#10151c"/>
  <text x="550" y="43" class="sans axis" text-anchor="middle">컴파일 대상 <tspan class="mono" fill="#aebbc7">target</tspan></text>
  <text x="43" y="239" class="sans axis" text-anchor="middle" transform="rotate(-90 43 239)">구성 <tspan class="mono" fill="#aebbc7">피처</tspan></text>

  <g transform="translate(90 67)">
    <rect x="164" y="0" width="150" height="48" rx="10" fill="#202c39"/>
    <rect x="322" y="0" width="150" height="48" rx="10" fill="#202c39"/>
    <rect x="480" y="0" width="150" height="48" rx="10" fill="#202c39"/>
    <rect x="638" y="0" width="150" height="48" rx="10" fill="#202c39"/>
    <text x="239" y="24" class="mono head">lib</text>
    <text x="397" y="24" class="mono head">bin</text>
    <text x="555" y="24" class="mono head">example</text>
    <text x="713" y="24" class="mono head">test</text>

    <rect x="0" y="60" width="154" height="86" rx="12" fill="#19222d" stroke="#344556"/>
    <text x="19" y="103" class="mono row">default</text>
    <rect x="0" y="156" width="154" height="86" rx="12" fill="#19222d" stroke="#344556"/>
    <text x="19" y="199" class="mono row">binary-search</text>

    <g fill="#55d6c2" stroke="#55d6c2" stroke-opacity=".35">
      <rect x="164" y="60" width="150" height="86" rx="12" fill="#55d6c2" fill-opacity=".08"/>
      <rect x="322" y="60" width="150" height="86" rx="12" fill="#55d6c2" fill-opacity=".08"/>
      <rect x="480" y="60" width="150" height="86" rx="12" fill="#55d6c2" fill-opacity=".08"/>
      <rect x="638" y="60" width="150" height="86" rx="12" fill="#55d6c2" fill-opacity=".08"/>
      <circle cx="239" cy="103" r="9"/><circle cx="397" cy="103" r="9"/>
      <circle cx="555" cy="103" r="9"/><circle cx="713" cy="103" r="9"/>
    </g>
    <g fill="#f47b32" stroke="#f47b32" stroke-opacity=".4">
      <rect x="164" y="156" width="150" height="86" rx="12" fill="#f47b32" fill-opacity=".09"/>
      <rect x="322" y="156" width="150" height="86" rx="12" fill="#f47b32" fill-opacity=".09"/>
      <rect x="480" y="156" width="150" height="86" rx="12" fill="#f47b32" fill-opacity=".09"/>
      <rect x="638" y="156" width="150" height="86" rx="12" fill="#f47b32" fill-opacity=".09"/>
      <circle cx="239" cy="199" r="9"/><circle cx="397" cy="199" r="9"/>
      <circle cx="555" cy="199" r="9"/><circle cx="713" cy="199" r="9"/>
    </g>
  </g>

  <g class="sans">
    <text x="126" y="365" class="legend"><tspan class="mono" fill="#ffd4bb">--all-targets</tspan>는 가로로 넓힙니다.</text>
    <text x="526" y="365" class="legend"><tspan class="mono" fill="#ffd4bb">--all-features</tspan>는 세로로 넓힙니다.</text>
    <text x="480" y="411" fill="#f4c95d" font-size="19" text-anchor="middle">두 옵션을 함께 써야 격자의 모든 칸을 검사합니다.</text>
  </g>
</svg>
