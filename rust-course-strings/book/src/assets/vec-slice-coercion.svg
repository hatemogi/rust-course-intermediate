<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Vec 참조가 슬라이스 참조로 강제 변환되는 과정</title>
  <desc id="desc">Vec 참조가 가리키는 Vec 값에는 원소 버퍼의 시작 위치, 길이, 용량이 있다. Deref의 deref 메서드는 시작 위치와 길이를 사용해 같은 원소 버퍼를 가리키는 슬라이스 참조를 만든다. 원소 복사와 새 할당은 일어나지 않고 용량 정보는 슬라이스에 포함되지 않는다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141c"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <marker id="cyanArrow" viewBox="0 0 16 16" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 8 L 0 16 z" fill="#55d6c2"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .heading { fill: #f4f7fa; font-size: 42px; font-weight: 850; }
      .label { fill: #eef3f7; font-size: 28px; font-weight: 760; }
      .small { fill: #aebdca; font-size: 22px; font-weight: 560; }
      .code { fill: #eef3f7; font-family: "SFMono-Regular", Consolas, monospace; font-size: 27px; font-weight: 650; }
      .field { fill: #b9c7d3; font-family: "SFMono-Regular", Consolas, monospace; font-size: 23px; }
      .value { fill: #f4f7fa; font-family: "SFMono-Regular", Consolas, monospace; font-size: 34px; font-weight: 750; }
      .note { fill: #dce5ec; font-size: 22px; font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#background)"/>
  <text x="800" y="72" class="heading" text-anchor="middle"><tspan font-family="SFMono-Regular, Consolas, monospace">&amp;Vec&lt;T&gt;</tspan>는 같은 원소를 <tspan font-family="SFMono-Regular, Consolas, monospace">&amp;[T]</tspan>로 빌려 줍니다</text>

  <text x="350" y="145" class="label" text-anchor="middle">변환 전</text>
  <text x="1250" y="145" class="label" text-anchor="middle">변환 후</text>

  <rect x="105" y="180" width="490" height="300" rx="28" fill="#17242e" stroke="#ff9868" stroke-width="4" filter="url(#shadow)"/>
  <rect x="160" y="220" width="180" height="64" rx="32" fill="#30231d" stroke="#ff9868" stroke-width="3"/>
  <text x="250" y="262" class="code" text-anchor="middle">&amp;Vec&lt;T&gt;</text>
  <text x="375" y="262" class="small">Vec 값 자체를 빌림</text>
  <line x1="155" y1="310" x2="545" y2="310" stroke="#405364" stroke-width="2"/>
  <text x="160" y="358" class="field">data</text>
  <text x="540" y="358" class="code" text-anchor="end">원소 시작 위치</text>
  <text x="160" y="408" class="field">len</text>
  <text x="540" y="408" class="code" text-anchor="end">3</text>
  <text x="160" y="458" class="field">capacity</text>
  <text x="540" y="458" class="code" text-anchor="end">4</text>

  <path d="M 625 315 L 945 315" fill="none" stroke="#55d6c2" stroke-width="6" stroke-linecap="round" marker-end="url(#cyanArrow)"/>
  <rect x="660" y="216" width="280" height="68" rx="34" fill="#123638" stroke="#55d6c2" stroke-width="3"/>
  <text x="800" y="259" class="code" text-anchor="middle">Deref::deref</text>
  <text x="800" y="358" fill="#55d6c2" font-size="23" font-weight="750" text-anchor="middle">data와 len으로 슬라이스 구성</text>

  <rect x="1005" y="180" width="490" height="300" rx="28" fill="#17242e" stroke="#55d6c2" stroke-width="4" filter="url(#shadow)"/>
  <rect x="1060" y="220" width="180" height="64" rx="32" fill="#123638" stroke="#55d6c2" stroke-width="3"/>
  <text x="1150" y="262" class="code" text-anchor="middle">&amp;[T]</text>
  <text x="1275" y="262" class="small">원소 구간을 빌림</text>
  <line x1="1055" y1="310" x2="1445" y2="310" stroke="#405364" stroke-width="2"/>
  <text x="1060" y="375" class="field">data</text>
  <text x="1440" y="375" class="code" text-anchor="end">같은 시작 위치</text>
  <text x="1060" y="430" class="field">len</text>
  <text x="1440" y="430" class="code" text-anchor="end">3</text>
  <text x="1250" y="466" fill="#8395a7" font-size="20" font-weight="620" text-anchor="middle">capacity 정보는 포함하지 않음</text>

  <text x="800" y="535" class="label" text-anchor="middle">두 참조가 결국 같은 원소 버퍼를 가리킵니다</text>
  <path d="M 350 480 C 350 550, 610 570, 785 590" fill="none" stroke="#ff9868" stroke-width="5" stroke-linecap="round"/>
  <path d="M 1250 480 C 1250 550, 990 570, 815 590" fill="none" stroke="#55d6c2" stroke-width="5" stroke-linecap="round"/>
  <circle cx="800" cy="590" r="13" fill="#17242e" stroke="#55d6c2" stroke-width="5"/>
  <path d="M 787 600 C 650 615, 470 590, 380 625" fill="none" stroke="#55d6c2" stroke-width="5" stroke-linecap="round" marker-end="url(#cyanArrow)"/>

  <g filter="url(#shadow)">
    <rect x="250" y="640" width="260" height="120" rx="18" fill="#1a2530" stroke="#55d6c2" stroke-width="4"/>
    <rect x="530" y="640" width="260" height="120" rx="18" fill="#1a2530" stroke="#55d6c2" stroke-width="4"/>
    <rect x="810" y="640" width="260" height="120" rx="18" fill="#1a2530" stroke="#55d6c2" stroke-width="4"/>
    <rect x="1090" y="640" width="260" height="120" rx="18" fill="#151d25" stroke="#53687b" stroke-width="3" stroke-dasharray="10 8"/>
  </g>
  <text x="380" y="711" class="value" text-anchor="middle">10</text>
  <text x="660" y="711" class="value" text-anchor="middle">20</text>
  <text x="940" y="711" class="value" text-anchor="middle">30</text>
  <text x="1220" y="699" class="small" text-anchor="middle">여유 공간</text>
  <text x="1220" y="730" fill="#8395a7" font-size="20" text-anchor="middle">capacity에만 포함</text>

  <rect x="150" y="810" width="1300" height="58" rx="20" fill="#111d25" stroke="#334858" stroke-width="2"/>
  <circle cx="220" cy="839" r="9" fill="#55d6c2"/>
  <text x="245" y="847" class="note">원소 복사 없음</text>
  <circle cx="610" cy="839" r="9" fill="#f4c95d"/>
  <text x="635" y="847" class="note">새 할당 없음</text>
  <circle cx="955" cy="839" r="9" fill="#b49cff"/>
  <text x="980" y="847" class="note"><tspan font-family="SFMono-Regular, Consolas, monospace">&amp;[T]</tspan>에서 <tspan font-family="SFMono-Regular, Consolas, monospace">&amp;Vec&lt;T&gt;</tspan>로는 되돌릴 수 없음</text>
</svg>
