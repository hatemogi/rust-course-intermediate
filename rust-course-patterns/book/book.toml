[book]
title = "우아한 Rust 중급: 패턴 문법"
authors = ["rust-course-intermediate"]
description = "Rust의 match와 구조 분해(destructuring) 패턴을 배우는 강의 교재"
language = "ko"
src = "src"

[build]
build-dir = "html"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/rust-course-intermediate/patterns/"
git-repository-url = "https://github.com/hatemogi/rust-course-intermediate"
edit-url-template = "https://github.com/hatemogi/rust-course-intermediate/edit/main/rust-course-patterns/book/{path}"
additional-css = ["theme/tooling.css"]

[output.html.playground]
editable = false
runnable = false
copyable = true
line-numbers = true

[preprocessor.rustdoc-excerpt]
command = "sh ../../mdbook-rustdoc/run.sh"
before = ["links"]
