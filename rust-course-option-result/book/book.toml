[book]
title = "우아한 Rust 중급: Option과 Result"
authors = ["rust-course-intermediate"]
description = "Rust의 Option<T>와 Result<T, E>로 값이 없는 경우와 오류를 다루는 법을 배우는 교재"
language = "ko"
src = "src"

[build]
build-dir = "html"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
site-url = "/rust-course-intermediate/option-result/"
git-repository-url = "https://github.com/hatemogi/rust-course-intermediate"
edit-url-template = "https://github.com/hatemogi/rust-course-intermediate/edit/main/rust-course-option-result/book/{path}"
additional-css = ["src/theme/custom.css", "theme/tooling.css"]

[output.html.playground]
editable = false
runnable = false
copyable = true
line-numbers = true

[preprocessor.rustdoc-excerpt]
command = "sh ../../mdbook-rustdoc/run.sh"
before = ["links"]

[rust]
edition = "2024"
