<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">map과 and_then: 결과를 한 겹 더 감싸는가</title>
<desc id="desc">Some(10)에 checked_div(2)를 적용하면 map은 Some(Some(5)), and_then은 Some(5)를 반환합니다.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55d6c2"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f47b32"/></marker></defs>
<rect width="1440" height="800" rx="28" fill="#10151c"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="56" y="70" font-size="38" fill="#eef3f7" text-anchor="start" font-weight="700">map과 and_then: 결과를 한 겹 더 감싸는가</text>
<text x="56" y="118" font-size="28" fill="#b8c4ce" text-anchor="start" font-weight="500">같은 계산: 10.checked_div(2) → Some(5)</text>
<rect x="40" y="155" width="1360" height="265" rx="18" fill="#19222d" stroke="#344556" stroke-width="3"/>
<text x="70" y="203" font-size="34" fill="#f4c95d" text-anchor="start" font-weight="700">map</text>
<rect x="80" y="233" width="240" height="105" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="200" y="298" font-size="32" fill="#eef3f7" text-anchor="middle" font-weight="500">Some(10)</text>
<path d="M 325 285 L 405 285" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#green)"/>
<rect x="420" y="233" width="350" height="105" rx="18" fill="#19222d" stroke="#344556" stroke-width="3"/>
<text x="595" y="278" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">checked_div(2)</text>
<text x="595" y="317" font-size="27" fill="#55d6c2" text-anchor="middle" font-weight="500">계산 결과: Some(5)</text>
<path d="M 778 285 L 900 285" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#green)"/>
<rect x="920" y="195" width="430" height="165" rx="18" fill="#34251d" stroke="#f47b32" stroke-width="3"/>
<text x="940" y="233" font-size="28" fill="#f47b32" text-anchor="start" font-weight="500">Some</text>
<rect x="1050" y="240" width="260" height="88" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="1180" y="294" font-size="32" fill="#eef3f7" text-anchor="middle" font-weight="500">Some(5)</text>
<text x="920" y="397" font-size="28" fill="#b8c4ce" text-anchor="start" font-weight="500">Option&lt;Option&lt;i32&gt;&gt;</text>
<rect x="40" y="455" width="1360" height="265" rx="18" fill="#19222d" stroke="#344556" stroke-width="3"/>
<text x="70" y="503" font-size="34" fill="#f4c95d" text-anchor="start" font-weight="700">and_then</text>
<rect x="80" y="533" width="240" height="105" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="200" y="598" font-size="32" fill="#eef3f7" text-anchor="middle" font-weight="500">Some(10)</text>
<path d="M 325 585 L 405 585" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#green)"/>
<rect x="420" y="533" width="350" height="105" rx="18" fill="#19222d" stroke="#344556" stroke-width="3"/>
<text x="595" y="578" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">checked_div(2)</text>
<text x="595" y="617" font-size="27" fill="#55d6c2" text-anchor="middle" font-weight="500">계산 결과: Some(5)</text>
<path d="M 778 585 L 900 585" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#green)"/>
<rect x="920" y="533" width="430" height="105" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="1135" y="598" font-size="32" fill="#eef3f7" text-anchor="middle" font-weight="500">Some(5)</text>
<text x="920" y="697" font-size="28" fill="#b8c4ce" text-anchor="start" font-weight="500">Option&lt;i32&gt;</text>
<text x="56" y="765" font-size="28" fill="#eef3f7" text-anchor="start" font-weight="500">map은 계산 결과를 다시 감싸고, and_then은 반환된 Option을 그대로 연결합니다.</text>
</g>
</svg>
