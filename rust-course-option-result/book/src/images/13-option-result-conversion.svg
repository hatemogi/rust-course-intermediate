<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Option과 Result 사이에서 무엇이 남고 사라질까?</title>
<desc id="desc">ok_or는 Some(value)를 Ok(value)로 바꾸고 None에는 지정한 오류를 넣습니다. ok는 Ok(value)를 Some(value)로 바꾸고 Err를 오류 정보 없는 None으로 바꿉니다.</desc>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55d6c2"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f47b32"/></marker></defs>
<rect width="1440" height="800" rx="28" fill="#10151c"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<text x="56" y="70" font-size="38" fill="#eef3f7" text-anchor="start" font-weight="700">Option과 Result 사이에서 무엇이 남고 사라질까?</text>
<text x="56" y="118" font-size="28" fill="#b8c4ce" text-anchor="start" font-weight="500">값은 그대로 옮기고, 없음과 실패는 서로 다른 방식으로 바꿉니다.</text>
<rect x="40" y="150" width="650" height="560" rx="18" fill="#19222d" stroke="#344556" stroke-width="3"/>
<text x="72" y="205" font-size="34" fill="#f4c95d" text-anchor="start" font-weight="700">Option → Result</text>
<text x="72" y="254" font-size="30" fill="#eef3f7" text-anchor="start" font-weight="500">ok_or(error)</text>
<rect x="750" y="150" width="650" height="560" rx="18" fill="#19222d" stroke="#344556" stroke-width="3"/>
<text x="782" y="205" font-size="34" fill="#f4c95d" text-anchor="start" font-weight="700">Result → Option</text>
<text x="782" y="254" font-size="30" fill="#eef3f7" text-anchor="start" font-weight="500">.ok()</text>
<rect x="65" y="310" width="250" height="85" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="190" y="364" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">Some(value)</text>
<path d="M 325 352 L 390 352" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#green)"/>
<rect x="405" y="310" width="260" height="85" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="535" y="364" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">Ok(value)</text>
<rect x="65" y="465" width="250" height="85" rx="18" fill="#19222d" stroke="#f47b32" stroke-width="3"/>
<text x="190" y="519" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">None</text>
<path d="M 325 507 L 390 507" fill="none" stroke="#f47b32" stroke-width="4" marker-end="url(#orange)"/>
<rect x="405" y="465" width="260" height="85" rx="18" fill="#19222d" stroke="#f47b32" stroke-width="3"/>
<text x="535" y="519" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">Err(error)</text>
<rect x="775" y="310" width="250" height="85" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="900" y="364" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">Ok(value)</text>
<path d="M 1035 352 L 1100 352" fill="none" stroke="#55d6c2" stroke-width="4" marker-end="url(#green)"/>
<rect x="1115" y="310" width="260" height="85" rx="18" fill="#19222d" stroke="#55d6c2" stroke-width="3"/>
<text x="1245" y="364" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">Some(value)</text>
<rect x="775" y="465" width="250" height="85" rx="18" fill="#19222d" stroke="#f47b32" stroke-width="3"/>
<text x="900" y="519" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">Err(error)</text>
<path d="M 1035 507 L 1100 507" fill="none" stroke="#f47b32" stroke-width="4" marker-end="url(#orange)"/>
<rect x="1115" y="465" width="260" height="85" rx="18" fill="#19222d" stroke="#f47b32" stroke-width="3"/>
<text x="1245" y="519" font-size="30" fill="#eef3f7" text-anchor="middle" font-weight="500">None</text>
<text x="365" y="612" font-size="28" fill="#f47b32" text-anchor="middle" font-weight="500">None에 사용할 오류를 지정합니다.</text>
<text x="365" y="664" font-size="25" fill="#b8c4ce" text-anchor="middle" font-weight="500">ok_or_else는 None일 때만 오류를 만듭니다.</text>
<text x="1075" y="612" font-size="28" fill="#f47b32" text-anchor="middle" font-weight="500">원래 오류 정보를 버립니다.</text>
<text x="1075" y="664" font-size="25" fill="#b8c4ce" text-anchor="middle" font-weight="500">None만으로 실패 이유를 되살릴 수 없습니다.</text>
<text x="56" y="770" font-size="28" fill="#eef3f7" text-anchor="start" font-weight="500">성공한 값은 보존되지만, 오류 정보까지 되돌릴 수 있는 변환은 아닙니다.</text>
</g>
</svg>
